name: 'RegressionBot Visual Testing'
description: 'Automated visual regression testing with RegressionBot.com'
author: 'RegressionBot'
branding:
  icon: 'aperture'
  color: 'blue'

inputs:
  command:
    description: 'The command to run (check, approve, status)'
    required: true
    default: 'check'
  api-key:
    description: 'RegressionBot API Key'
    required: true
  project:
    description: 'Project name. With no other inputs the saved project config is run as-is.'
    required: false
  test-origin:
    description: 'The candidate URL to test (required unless project is set)'
    required: false
  base-origin:
    description: 'Optional baseline URL to compare against'
    required: false
  sitemap-url:
    description: 'Explicit sitemap.xml location'
    required: false
  devices:
    description: 'Comma-separated list of devices (e.g. "Desktop Chrome, iPhone 13"). Default: Desktop Chrome, or the saved project config.'
    required: false
  scan:
    description: 'Glob pattern to scan (e.g. "/**", "/blog/**")'
    required: false
  exclude:
    description: 'Comma-separated list of glob patterns to exclude'
    required: false
  auto-approve:
    description: 'Automatically approve results as baselines (true/false)'
    required: false
    default: 'false'
  mask:
    description: 'Comma-separated CSS selectors to mask (e.g. ".ads, #modal")'
    required: false
  concurrency:
    description: 'Pages captured in parallel, 1-20. Default: 4, or the saved project config.'
    required: false
  skip-summaries:
    description: 'Skip waiting for RegressionBot regression summaries (true/false)'
    required: false
    default: 'false'
  job-id:
    description: 'The Job ID (required for approve or status command)'
    required: false
  fail-on-regression:
    description: 'Fail the action build if regressions are found (true/false)'
    required: false
    default: 'true'
  fail-on-error:
    description: 'Fail the action build if errors are encountered (true/false)'
    required: false
    default: 'true'
  change-description:
    description: 'What this run is meant to change. Lets RegressionBot judge each change as intentional, a bug, or noise.'
    required: false
  expected-changes:
    description: 'Comma-separated list of expected visual changes'
    required: false
  send-pr-context:
    description: 'Read the PR title, description, commit and changed files as intent context (true/false). Set false to send nothing from the PR.'
    required: false
    default: 'true'
  fail-on:
    description: 'What fails the build: "any" regression (default), or only "unintended" ones (judged bug or needs review; unjudged changes still fail)'
    required: false
    default: 'any'
  github-token:
    description: 'GitHub token to automatically post/update a Pull Request comment'
    required: false
  pr-number:
    description: 'Explicit PR number to comment on (auto-detected if omitted)'
    required: false

outputs:
  job-id:
    description: 'The ID of the RegressionBot job'
  status:
    description: 'The final status of the job'
  overall-score:
    description: 'The overall visual stability score (0-100)'
  regression-count:
    description: 'The number of regressions detected'
  error-count:
    description: 'The number of errors encountered'
  summary:
    description: 'A markdown summary of the job run'
  intent-summary:
    description: 'One line on how the changes line up with the stated intent (empty when no intent was sent)'
  bug-count:
    description: 'Regressions judged unintended'
  intentional-count:
    description: 'Regressions judged intentional'
  needs-review-count:
    description: 'Regressions the judgement could not settle'

runs:
  using: 'node20'
  main: 'dist/index.js'
